services:
  db:
    image: pgvector/pgvector:pg18
    container_name: prrag-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prrag}
      POSTGRES_DB: ${POSTGRES_DB:-prrag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prrag} -d ${POSTGRES_DB:-prrag}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Runtime API. Guarded behind the "demo" profile: it is NOT started by the
  # default `up` (or by the DevContainer flow), so the OpenAI key interpolation
  # in `docker compose config` does not leak it into everyday dev logs. Start
  # it on demand when you actually need a full runtime demo:
  #   docker compose --profile demo up --build api
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prrag-api
    profiles:
      - demo
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-prrag};Username=${POSTGRES_USER:-prrag};Password=${POSTGRES_PASSWORD:-prrag}"
      OpenAI__ApiKey: ${OpenAI__ApiKey:?OpenAI__ApiKey must be set in the environment}
      OpenAI__EmbeddingModel: ${OpenAI__EmbeddingModel:-text-embedding-3-small}
      OpenAI__ChatModel: ${OpenAI__ChatModel:-gpt-4o-mini}
      RAG__TopK: ${RAG__TopK:-5}
      RAG__MinSimilarity: ${RAG__MinSimilarity:-0.7}
      Data__FilePath: /data/purchase.json
      Cors__AllowedOrigins: ${CORS__AllowedOrigins:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./data:/data:ro
      - ./reports:/app/reports

  # Web front-end. Also guarded behind the "demo" profile, matching the API.
  #   docker compose --profile demo up --build web api
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: prrag-web
    profiles:
      - demo
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:8080"

  datagen:
    build:
      context: .
      dockerfile: Dockerfile.datagen
    container_name: prrag-datagen
    profiles:
      - tools
    volumes:
      - ./data:/data

  # Development container (VS Code / Codespaces). This service has no
  # `profiles` because the Dev Containers CLI runs `docker compose up -d`
  # without `--profile`; giving it a profile would exclude it from the up and
  # the DevContainer would never start (the classic "open seems stuck" hang).
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: prrag-devcontainer
    ports:
      - "${API_PORT:-8080}:8080"
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspaces:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-prrag};Username=${POSTGRES_USER:-prrag};Password=${POSTGRES_PASSWORD:-prrag}"
      OpenAI__EmbeddingModel: ${OpenAI__EmbeddingModel:-text-embedding-3-small}
      OpenAI__ChatModel: ${OpenAI__ChatModel:-gpt-4o-mini}
      RAG__TopK: ${RAG__TopK:-5}
      RAG__MinSimilarity: ${RAG__MinSimilarity:-0.7}
      Data__FilePath: /workspaces/data/purchase.json
    command: sleep infinity

volumes:
  db_data:
